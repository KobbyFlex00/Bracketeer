# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# The database lives on Neon (Render's free Postgres is deleted after 30 days):
#   Neon project red-voice-54849345 (org org-lingering-fire-17770382), branch "production".
# Get both connection strings with `neon env pull` (or Neon Console -> Connect):
#   DATABASE_URL           pooled URL (host has "-pooler"): app traffic from gunicorn
#   DATABASE_URL_UNPOOLED  direct URL: `flask db upgrade` runs Alembic over this one
services:
  - type: web
    name: bracketeer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && flask ensure-admin && gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: FLASK_APP
        value: wsgi.py
      - key: BRACKETEER_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the pooled Neon URL (production branch) when Render asks
      - key: DATABASE_URL_UNPOOLED
        sync: false # paste the direct (unpooled) Neon URL; used only for migrations
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # choose a strong password (8+ characters) when Render asks

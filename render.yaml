# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# The database lives on Neon's free tier (Render's free Postgres is deleted after 30 days).
services:
  - type: web
    name: bracketeer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && flask ensure-admin && gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: FLASK_APP
        value: wsgi.py
      - key: BRACKETEER_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Neon connection string when Render asks
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # choose a strong password (8+ characters) when Render asks
